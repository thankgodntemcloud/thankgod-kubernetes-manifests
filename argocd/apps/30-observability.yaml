# observability: Collector, OpAMP, Jaeger, Prometheus, Grafana
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astronomy-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3" # created after the apps with a lower number are Healthy
    # Compare using the live server's defaults, so StatefulSet fields Kubernetes
    # fills in (volumeClaimTemplates apiVersion/kind/status) don't show as OutOfSync
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/digitalwitchdemo/k8s-file.git
    targetRevision: main
    path: 30-observability
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
