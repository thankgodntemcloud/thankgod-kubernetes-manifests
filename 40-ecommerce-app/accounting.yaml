# Accounting service (.NET) - consumes Kafka orders, writes to PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting
  namespace: ecommerce-app
  labels:
    app: accounting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounting
  template:
    metadata:
      labels:
        app: accounting
    spec:
      enableServiceLinks: false
      containers:
        - name: accounting
          image: 060647991200.dkr.ecr.us-east-2.amazonaws.com/ecomerce/accounting:latest
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: OTEL_SERVICE_NAME
              value: accounting
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=low"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4318
            - name: OTEL_DOTNET_AUTO_TRACES_ENTITYFRAMEWORKCORE_INSTRUMENTATION_ENABLED
              value: "false"
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef: { name: app-secrets, key: ACCOUNTING_DB_CONNECTION_STRING }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 160Mi }
