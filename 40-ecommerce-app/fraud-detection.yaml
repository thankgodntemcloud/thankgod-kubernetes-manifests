# Fraud detection service (Kotlin) - consumes Kafka orders
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection
  namespace: ecommerce-app
  labels:
    app: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-detection
  template:
    metadata:
      labels:
        app: fraud-detection
    spec:
      enableServiceLinks: false
      containers:
        - name: fraud-detection
          image: 060647991200.dkr.ecr.us-east-2.amazonaws.com/ecomerce/fraud-detection:latest
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: OTEL_SERVICE_NAME
              value: fraud-detection
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=low"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4318
            - name: OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES
              value: "true"
            - name: OTEL_INSTRUMENTATION_MESSAGING_EXPERIMENTAL_RECEIVE_TELEMETRY_ENABLED
              value: "true"
            - name: OTEL_EXPERIMENTAL_SDK_TELEMETRY_VERSION
              value: latest
          resources:
            requests: { cpu: 20m, memory: 180Mi }
            limits: { memory: 300Mi }
