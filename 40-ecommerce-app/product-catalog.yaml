# Product catalog service (Go) - products from PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: ecommerce-app
  labels:
    app: product-catalog
spec:
  selector:
    app: product-catalog
  ports:
    - name: grpc
      port: 3550
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: ecommerce-app
  labels:
    app: product-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-catalog
  template:
    metadata:
      labels:
        app: product-catalog
    spec:
      enableServiceLinks: false
      containers:
        - name: product-catalog
          image: 060647991200.dkr.ecr.us-east-2.amazonaws.com/ecomerce/product-catalog:latest
          ports:
            - name: grpc
              containerPort: 3550
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: OTEL_SERVICE_NAME
              value: product-catalog
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=high"
            - name: GOMEMLIMIT
              value: 16MiB
            - name: OTEL_GO_X_OBSERVABILITY
              value: "true"
            - name: OTEL_CONFIG_FILE
              value: /otel-config.yml
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: database
            - name: OPAMP_SERVER_ENDPOINT
              value: wss://opamp-server.observability:4320/v1/opamp
            - name: OPAMP_SERVER_TLS_INSECURE_SKIP_VERIFY
              value: "true"
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef: { name: app-secrets, key: PRODUCT_CATALOG_DB_CONNECTION_STRING }
          resources:
            requests: { cpu: 20m, memory: 19Mi }
            limits: { memory: 32Mi }
          readinessProbe:
            grpc: { port: 3550 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 60
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: otel-config
              mountPath: /otel-config.yml
              subPath: otel-config.yml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: otel-config
          configMap:
            name: product-catalog-otel-config
        - name: tmp
          emptyDir: {}
