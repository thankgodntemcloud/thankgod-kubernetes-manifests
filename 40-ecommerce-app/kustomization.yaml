apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce-app

commonAnnotations:
  argocd.argoproj.io/sync-wave: "4"

resources:
  - flagd.yaml
  # Shop services
  - ad.yaml
  - cart.yaml
  - checkout.yaml
  - currency.yaml
  - email.yaml
  - payment.yaml
  - product-catalog.yaml
  - quote.yaml
  - recommendation.yaml
  - shipping.yaml
  - accounting.yaml
  - fraud-detection.yaml
  - image-provider.yaml
  - frontend.yaml
  - frontend-proxy.yaml
  - telemetry-docs.yaml
  - load-generator.yaml
  # Public URL: https://shop.digitalwitch.online
  - ingress-shop.yaml

configMapGenerator:
  - name: app-env
    envs:
      - config/app.env
  - name: product-catalog-otel-config
    files:
      - config/otel-config.yml
  - name: flagd-default-flags
    files:
      - config/demo.flagd.json

# Image tags - updated automatically by the ecommerce-final-project pipeline
images:
  - name: 060647991200.dkr.ecr.us-east-2.amazonaws.com/ecomerce/accounting
    newTag: "10"
