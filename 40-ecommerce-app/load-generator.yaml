# Load generator (Locust) - simulated shoppers; UI at /loadgen/
apiVersion: v1
kind: Service
metadata:
  name: load-generator
  namespace: ecommerce-app
  labels:
    app: load-generator
spec:
  selector:
    app: load-generator
  ports:
    - name: http
      port: 8089
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: ecommerce-app
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      enableServiceLinks: false
      containers:
        - name: load-generator
          image: 060647991200.dkr.ecr.us-east-2.amazonaws.com/ecomerce/load-generator:latest
          ports:
            - name: http
              containerPort: 8089
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: OTEL_SERVICE_NAME
              value: load-generator
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=low"
            - name: LOCUST_WEB_HOST
              value: 0.0.0.0
            - name: LOCUST_BROWSER_TRAFFIC_ENABLED
              value: "true"
            - name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED
              value: "true"
            - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
              value: python
          resources:
            requests: { cpu: 20m, memory: 900Mi }
            limits: { memory: 1500Mi }
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
