# Quote service (PHP) - shipping quotes
apiVersion: v1
kind: Service
metadata:
  name: quote
  namespace: ecommerce-app
  labels:
    app: quote
spec:
  selector:
    app: quote
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote
  namespace: ecommerce-app
  labels:
    app: quote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quote
  template:
    metadata:
      labels:
        app: quote
    spec:
      enableServiceLinks: false
      containers:
        - name: quote
          image: 060647991200.dkr.ecr.us-east-2.amazonaws.com/ecomerce/quote:latest
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: OTEL_SERVICE_NAME
              value: quote
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=low"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4318
            - name: OTEL_PHP_AUTOLOAD_ENABLED
              value: "true"
            - name: OTEL_PHP_INTERNAL_METRICS_ENABLED
              value: "true"
          resources:
            requests: { cpu: 20m, memory: 24Mi }
            limits: { memory: 40Mi }
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
