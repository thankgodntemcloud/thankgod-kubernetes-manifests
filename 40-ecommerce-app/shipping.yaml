# Shipping service (Rust) - shipping cost and tracking
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: ecommerce-app
  labels:
    app: shipping
spec:
  selector:
    app: shipping
  ports:
    - name: http
      port: 50050
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: ecommerce-app
  labels:
    app: shipping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping
  template:
    metadata:
      labels:
        app: shipping
    spec:
      enableServiceLinks: false
      containers:
        - name: shipping
          image: 060647991200.dkr.ecr.us-east-2.amazonaws.com/ecomerce/shipping:latest
          ports:
            - name: http
              containerPort: 50050
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: OTEL_SERVICE_NAME
              value: shipping
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=high"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          resources:
            requests: { cpu: 20m, memory: 19Mi }
            limits: { memory: 32Mi }
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
