# Checkout service (Go) - places orders, publishes to Kafka
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: ecommerce-app
  labels:
    app: checkout
spec:
  selector:
    app: checkout
  ports:
    - name: grpc
      port: 5050
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: ecommerce-app
  labels:
    app: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      enableServiceLinks: false
      containers:
        - name: checkout
          image: 060647991200.dkr.ecr.us-east-2.amazonaws.com/ecomerce/checkout:latest
          ports:
            - name: grpc
              containerPort: 5050
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: OTEL_SERVICE_NAME
              value: checkout
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=critical"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4318
            - name: GOMEMLIMIT
              value: 16MiB
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_GO_X_OBSERVABILITY
              value: "true"
          resources:
            requests: { cpu: 20m, memory: 19Mi }
            limits: { memory: 32Mi }
          readinessProbe:
            grpc: { port: 5050 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 60
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
