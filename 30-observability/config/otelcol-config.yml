receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"
          allowed_headers:
            - "content-type"
            - "traceparent"
            - "baggage"
  http_check/frontend-proxy:
    targets:
      - endpoint: http://frontend-proxy.ecommerce-app:8080
  nginx:
    endpoint: http://image-provider.ecommerce-app:8081/status
    collection_interval: 10s
  redis:
    endpoint: valkey-cart.ecommerce-data:6379
    username: valkey
    collection_interval: 10s
  postgresql:
    endpoint: astronomy-db.ecommerce-data:5432
    username: monitoring_user
    password: ${env:POSTGRES_MONITORING_PASSWORD}
    metrics:
      postgresql.blks_hit:
        enabled: true
      postgresql.blks_read:
        enabled: true
      postgresql.tup_fetched:
        enabled: true
      postgresql.tup_returned:
        enabled: true
      postgresql.tup_inserted:
        enabled: true
      postgresql.tup_updated:
        enabled: true
      postgresql.tup_deleted:
        enabled: true
      postgresql.deadlocks:
        enabled: true
    tls:
      insecure: true
  kafka_metrics:
    scrapers:
      - brokers
      - topics
      - consumers
    brokers:
      - kafka.ecommerce-data:9092
    collection_interval: 10s
  # Prometheus /metrics endpoint exposed by the ad service
  prometheus/ad:
    config:
      scrape_configs:
        - job_name: ad
          scrape_interval: 10s
          static_configs:
            - targets: ["ad.ecommerce-app:9465"]
  # Cluster-level metrics: pods, deployments, nodes, restarts...
  k8s_cluster:
    collection_interval: 30s

exporters:
  debug:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    sending_queue:
      batch:
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
    sending_queue:
      batch:
  opensearch:
    logs_index: otel-logs
    logs_index_time_format: "yyyy-MM-dd"
    http:
      endpoint: http://opensearch.logging:9200
      tls:
        insecure: true
    sending_queue:
      batch:

extensions:
  opamp:
    server:
      ws:
        endpoint: wss://opamp-server:4320/v1/opamp
        tls:
          insecure_skip_verify: true
    instance_uid: 00000000-0000-7000-8000-000000000001
    capabilities:
      reports_effective_config: true
      reports_health: true
      reports_available_components: true
    agent_description:
      include_resource_attributes: true
      non_identifying_attributes:
        deployment.environment.name: demo
        demo.collector.role: gateway

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  # Adds k8s.namespace.name, k8s.pod.name, k8s.deployment.name... to telemetry
  # based on the IP of the pod that sent it
  k8s_attributes: {}
  resource_detection:
    detectors: [env, system]
    system:
      hostname_sources: ["os"]
  filter/sanitize_profiles:
    error_mode: ignore
    profiles:
      profile:
        - 'IsMatch(resource.attributes["service.name"], "containerd-shim-.*")'
  transform/sanitize_logs:
    error_mode: ignore
    log_statements:
      - context: scope
        statements:
          - set(attributes["otelcol_signal"], attributes["otelcol.signal"]) where attributes["otelcol.signal"] != nil and not IsMap(attributes["otelcol.signal"])
          - delete_key(attributes, "otelcol.signal") where attributes["otelcol_signal"] != nil
  gen_ai_normalizer:
    sources:
      - name: openllmetry
  transform/sanitize_spans:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set_semconv_span_name("1.43.0", "original_span_name")
  # Redact sensitive attributes before export
  transform/redact_sensitive_data:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "demo.payment.card_cvv") where attributes["demo.payment.card_cvv"] != nil
          - set(attributes["user.hash"], SHA256(attributes["user.email"])) where attributes["user.email"] != nil
          - delete_key(attributes, "user.email") where attributes["user.email"] != nil
          - replace_pattern(attributes["demo.payment.card_number"], "^\\d{4}-\\d{4}-\\d{4}-", "****-****-****-") where attributes["demo.payment.card_number"] != nil

connectors:
  span_metrics:

service:
  extensions: [opamp]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [k8s_attributes, resource_detection, memory_limiter, transform/sanitize_spans, gen_ai_normalizer, transform/redact_sensitive_data]
      exporters: [otlp_grpc/jaeger, span_metrics]
    metrics:
      receivers: [otlp, http_check/frontend-proxy, nginx, redis, postgresql, kafka_metrics, prometheus/ad, k8s_cluster, span_metrics]
      processors: [k8s_attributes, resource_detection, memory_limiter]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [k8s_attributes, resource_detection, memory_limiter, transform/sanitize_logs]
      exporters: [opensearch]
    profiles:
      receivers: [otlp]
      processors: [resource_detection, filter/sanitize_profiles, memory_limiter]
      exporters: [debug]
  telemetry:
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://localhost:4318
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://localhost:4318
