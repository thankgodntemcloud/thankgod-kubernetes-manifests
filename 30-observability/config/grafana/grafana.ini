# Grafana settings for https://grafana.digitalwitch.online
# (replaces src/grafana/grafana.ini, which served Grafana under /grafana/ with
# anonymous Admin access - unsafe on a public URL).
# The admin user/password come from the grafana-admin Secret
# (GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD).

[paths]
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_port = 3000
domain = grafana.digitalwitch.online
root_url = https://grafana.digitalwitch.online/
serve_from_sub_path = false

[security]
cookie_secure = true

[users]
allow_sign_up = false
home_page = /dashboards/f/demo/

[auth]
disable_login_form = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
