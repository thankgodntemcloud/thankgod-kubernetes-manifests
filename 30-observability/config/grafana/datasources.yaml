# Grafana data sources (merged from src/grafana/provisioning/datasources/*),
# with in-cluster addresses and public URLs for the trace links.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: webstore-metrics
    type: prometheus
    url: http://prometheus:9090
    editable: true
    isDefault: true
    jsonData:
      timeInterval: "60s"
      exemplarTraceIdDestinations:
        - datasourceUid: webstore-traces
          name: trace_id
        - url: https://jaeger.digitalwitch.online/trace/$${__value.raw}
          name: trace_id
          urlDisplayLabel: View in Jaeger UI
        - url: https://grafana.digitalwitch.online/d/W2gX2zHVk/demo-dashboard?orgId=1&var-service=All&var-traceId=$${__value.raw}
          name: trace_id
          urlDisplayLabel: View in Logs (OpenSearch)

  - name: Jaeger
    uid: webstore-traces
    type: jaeger
    url: http://jaeger:16686
    editable: true
    isDefault: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: webstore-logs
        spanStartTimeShift: "-20m"
        spanEndTimeShift: "20m"
        filterByTraceID: true
        filterBySpanID: true
        customQuery: true
        query: traceId:"$${__trace.traceId}" AND spanId:"$${__span.spanId}"

  - name: OpenSearch
    uid: webstore-logs
    type: grafana-opensearch-datasource
    url: http://opensearch.logging:9200/
    access: proxy
    editable: true
    isDefault: false
    jsonData:
      # One index per day (otel-logs-2026-10-19); the daily pattern lets the
      # health check and searches open exactly the days needed
      database: "[otel-logs-]YYYY-MM-DD"
      interval: Daily
      flavor: opensearch
      logLevelField: severity.text.keyword
      logMessageField: body
      pplEnabled: true
      timeField: observedTimestamp
      version: 3.7.0
