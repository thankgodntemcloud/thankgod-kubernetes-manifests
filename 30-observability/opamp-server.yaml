# OpAMP server - remote management/status of the collector and the cart and
# product-catalog SDKs (wss://opamp-server.observability:4320/v1/opamp)
apiVersion: v1
kind: Service
metadata:
  name: opamp-server
  namespace: observability
  labels:
    app: opamp-server
spec:
  selector:
    app: opamp-server
  ports:
    - name: opamp
      port: 4320
      targetPort: opamp
    - name: ui
      port: 4321
      targetPort: ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opamp-server
  namespace: observability
  labels:
    app: opamp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opamp-server
  template:
    metadata:
      labels:
        app: opamp-server
    spec:
      enableServiceLinks: false
      containers:
        - name: opamp-server
          image: 060647991200.dkr.ecr.us-east-2.amazonaws.com/ecomerce/opamp-server:latest
          ports:
            - name: opamp
              containerPort: 4320
            - name: ui
              containerPort: 4321
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: ui }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: ui }
            initialDelaySeconds: 20
            periodSeconds: 20
