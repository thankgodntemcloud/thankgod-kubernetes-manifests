# AI assistant - MCP server (Python): exposes the shop's tools (products,
# cart...) to the agent over the Model Context Protocol.
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: ai-assistant
  labels:
    app: mcp
spec:
  selector:
    app: mcp
  ports:
    - name: http
      port: 8011
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: ai-assistant
  labels:
    app: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      enableServiceLinks: false
      containers:
        - name: mcp
          image: 060647991200.dkr.ecr.us-east-2.amazonaws.com/ecomerce/mcp:latest
          ports:
            - name: http
              containerPort: 8011
          envFrom:
            - configMapRef:
                name: ai-env
          env:
            - name: OTEL_SERVICE_NAME
              value: mcp
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=opentelemetry-demo,service.version=3.0.0,service.criticality=low"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED
              value: "true"
          resources:
            requests: { cpu: 50m, memory: 300Mi }
            limits: { memory: 500Mi }
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
