apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-assistant

commonAnnotations:
  argocd.argoproj.io/sync-wave: "5"

# AI assistant: chatbot (chat UI) -> agent (LLM) -> mcp (shop tools).
# Reached through the shop: https://shop.digitalwitch.online/chatbot/
resources:
  - chatbot.yaml
  - agent.yaml
  - mcp.yaml

configMapGenerator:
  - name: ai-env
    envs:
      - config/ai.env
  # Recorded LLM answers the agent replays (no AI API key needed)
  - name: agent-vcr-cassettes
    files:
      - config/vcr_cassettes/azure_gpt-5.5_cassette.yaml
      - config/vcr_cassettes/claude-opus-4-7_cassette.yaml

# Image tags - updated automatically by the ecommerce-final-project pipeline
images:
  - name: 060647991200.dkr.ecr.us-east-2.amazonaws.com/ecomerce/agent
    newTag: "16"
  - name: 060647991200.dkr.ecr.us-east-2.amazonaws.com/ecomerce/chatbot
    newTag: "17"
  - name: 060647991200.dkr.ecr.us-east-2.amazonaws.com/ecomerce/mcp
    newTag: "10"
