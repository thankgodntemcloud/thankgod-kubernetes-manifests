# PostgreSQL ("astronomy-db") - product catalog and accounting data
apiVersion: v1
kind: Service
metadata:
  name: astronomy-db
  namespace: ecommerce-data
  labels:
    app: astronomy-db
spec:
  clusterIP: None # headless: stable DNS for the StatefulSet pod
  selector:
    app: astronomy-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: astronomy-db
  namespace: ecommerce-data
  labels:
    app: astronomy-db
spec:
  serviceName: astronomy-db
  replicas: 1
  selector:
    matchLabels:
      app: astronomy-db
  template:
    metadata:
      labels:
        app: astronomy-db
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18.4
          args: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_ASTRONOMY_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_ASTRONOMY_PASSWORD }
            - name: POSTGRES_MONITORING_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secrets, key: POSTGRES_MONITORING_PASSWORD }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            # Postgres 18 images keep their data under /var/lib/postgresql/18/docker
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources:
          requests:
            storage: 5Gi
